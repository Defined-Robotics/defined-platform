# Defined Robotics — Docker Compose (simulation stack)
# Usage: docker compose up  (from work/defined_platform/docker/)
#
# Services:
#   sim        — Full simulation: Gz Sim headless + Nav2 + rosbridge
#   rviz       — RViz2 visualisation (optional, requires X11)
#   sim-gui    — Simulation with Gz GUI enabled (optional, requires X11)
#
# With GUI on Linux (X11 Unix socket, grant access to this user only):
#   xhost +si:localuser:$USER
#   docker compose --profile viz up rviz
#   docker compose --profile gui up sim-gui
#   NOTE: on Linux also mount /tmp/.X11-unix:/tmp/.X11-unix in the service volumes
#
# With GUI on macOS (XQuartz listens on :1 / port 6001 natively — no socat needed):
#   xhost +127.0.0.1
#   DISPLAY=host.docker.internal:1 docker compose --profile viz up rviz
#   DISPLAY=host.docker.internal:1 docker compose --profile gui up sim-gui
#
# NOTE: sim and sim-gui are mutually exclusive — both bind port 9090.
#   Stop sim before starting sim-gui: docker compose down
#
# Environment variables (set in shell or a .env file):
#   DISPLAY        — X11 display
#   ROS_DOMAIN_ID  — ROS2 DDS domain (default 0)


services:

  # ---------------------------------------------------------------------------
  # sim: Full simulation stack
  # Runs: Gz Sim (headless) + Nav2 + rosbridge WebSocket
  # ---------------------------------------------------------------------------
  sim:
    platform: linux/arm64
    build:
      context: ..                          # build context = work/defined_platform/
      dockerfile: docker/Dockerfile.ros2
    image: defined_robotics/sim:latest
    container_name: defined_sim

    environment:
      # X11 display — needed only if use_gui:=true
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # Help Gz Sim find model SDF files installed by the package
      - GZ_SIM_RESOURCE_PATH=/ros2_ws/install/defined_gazebo/share/defined_gazebo/models

    ports:
      - "127.0.0.1:9090:9090"  # rosbridge WebSocket — localhost only (C3)
      - "127.0.0.1:8765:8765"  # foxglove_bridge WebSocket — Foxglove Studio (C3)
      - "127.0.0.1:1667:1667"  # Groot2 ZMQ publisher (used by defined_runtime)

    volumes:
      # Live source mount — YAML/param changes visible without image rebuild.
      # C++ nodes still require colcon rebuild inside the container.
      - ../src:/ros2_ws/src:ro
      # Live-mount installed config dirs so YAML param changes apply without rebuild.
      # These overlay the named-volume install, giving src precedence for config only.
      - ../src/defined_navigation/config:/ros2_ws/install/defined_navigation/share/defined_navigation/config:ro
      - ../src/defined_gazebo/config:/ros2_ws/install/defined_gazebo/share/defined_gazebo/config:ro
      # Compiled BT XML produced by the verb-compiler on the host
      - ../../verb-compiler/build:/bt_xml:ro
      # Debug executor and tools
      - ../../verb-compiler/tools:/tools:ro
      # SLAM tuning tools (slam_patrol.py, score_map.py)
      - ../../tools/slam_tune:/slam_tools:ro
      # Named volumes keep colcon artefacts between compose up/down cycles
      - defined_build:/ros2_ws/build
      - defined_install:/ros2_ws/install

    networks:
      - defined_net

    # Security hardening (W5)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Default: headless (no Gz GUI), maze world.
    # Override for GUI: docker compose run sim ros2 launch ... use_gui:=true
    command: >
      ros2 launch defined_bringup simulation.launch.py use_gui:=false use_slam:=true run_bt:=true run_explore:=true

  # ---------------------------------------------------------------------------
  # rviz: Optional RViz2 visualisation
  # Requires X11 forwarding on the host.
  # Start with: docker compose --profile viz up rviz
  # ---------------------------------------------------------------------------
  rviz:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: defined_robotics/sim:latest
    container_name: defined_rviz
    profiles:
      - viz
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - LIBGL_ALWAYS_SOFTWARE=1
      - OGRE_RTT_MODE=Copy          # prevents GLXContext failures over X11 forwarding
    volumes:
      - ../src:/ros2_ws/src:ro
      - defined_install:/ros2_ws/install
    networks:
      - defined_net
    depends_on:
      - sim
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        if [ -f /ros2_ws/install/setup.bash ]; then source /ros2_ws/install/setup.bash; fi &&
        rviz2
      "

  # ---------------------------------------------------------------------------
  # sim-gui: Simulation stack with Gz GUI enabled
  # Requires X11 forwarding on the host.
  # Start with: docker compose --profile gui up sim-gui
  # On macOS: DISPLAY=host.docker.internal:1 docker compose --profile gui up sim-gui
  # ---------------------------------------------------------------------------
  sim-gui:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: defined_robotics/sim:latest
    container_name: defined_sim_gui
    profiles:
      - gui
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - GZ_SIM_RESOURCE_PATH=/ros2_ws/install/defined_gazebo/share/defined_gazebo/models
      - LIBGL_ALWAYS_SOFTWARE=1
      - OGRE_RTT_MODE=Copy          # prevents GLXContext failures over X11 forwarding
      - GALLIUM_DRIVER=softpipe     # more portable than llvmpipe on ARM64
    ports:
      - "127.0.0.1:9090:9090"  # rosbridge WebSocket — localhost only (C3)
      - "127.0.0.1:8765:8765"  # foxglove_bridge WebSocket — Foxglove Studio (C3)
    volumes:
      - ../src:/ros2_ws/src:ro
      - ../../verb-compiler/build:/bt_xml:ro
      # Debug executor and tools
      - ../../verb-compiler/tools:/tools:ro
      # SLAM tuning tools (slam_patrol.py, score_map.py)
      - ../../tools/slam_tune:/slam_tools:ro
      - defined_build:/ros2_ws/build
      - defined_install:/ros2_ws/install
    networks:
      - defined_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      ros2 launch defined_bringup simulation.launch.py use_gui:=true use_slam:=true

  # ---------------------------------------------------------------------------
  # tb3: TurtleBot3 reference simulation
  # Validates that SLAM + Nav2 + patrol tooling works end-to-end on a known-good robot.
  # Uses TurtleBot3 Burger in the standard tb3_world via nav2_bringup.
  #
  # Start with: docker compose --profile tb3 up tb3
  # Then run patrol: docker exec defined_tb3 python3 /slam_tools/slam_patrol.py --world room
  # ---------------------------------------------------------------------------
  tb3:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros2
    image: defined_robotics/sim:latest
    container_name: defined_tb3
    profiles:
      - tb3
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TURTLEBOT3_MODEL=burger
      - GAZEBO_MODEL_PATH=/opt/ros/jazzy/share/turtlebot3_gazebo/models
    ports:
      - "127.0.0.1:9091:9090"  # rosbridge (different port to avoid conflict with sim)
      - "127.0.0.1:8766:8765"  # foxglove_bridge
    volumes:
      - ../../tools/slam_tune:/slam_tools:ro
      - defined_build:/ros2_ws/build
      - defined_install:/ros2_ws/install
      # Custom nav2 params with fixed global_costmap size
      - ../../tools/slam_tune/nav2_params_tb3.yaml:/nav2_params_tb3.yaml:ro
    networks:
      - defined_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        export TURTLEBOT3_MODEL=burger &&
        ros2 launch nav2_bringup tb3_simulation_launch.py slam:=True headless:=True use_rviz:=False params_file:=/nav2_params_tb3.yaml &
        sleep 10 &&
        ros2 launch foxglove_bridge foxglove_bridge_launch.xml &&
        wait
      "

  # ---------------------------------------------------------------------------
  # teleop: Keyboard teleoperation
  # Requires interactive terminal.
  # Start with: docker compose --profile teleop run teleop
  # ---------------------------------------------------------------------------
  teleop:
    image: defined_robotics/sim:latest
    container_name: defined_teleop
    profiles:
      - teleop
    stdin_open: true
    tty: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    networks:
      - defined_net
    depends_on:
      - sim
    command: >
      bash -c "
        source /opt/ros/jazzy/setup.bash &&
        ros2 run teleop_twist_keyboard teleop_twist_keyboard
      "

# ---------------------------------------------------------------------------
# Named volumes — persist colcon build artefacts across restarts.
# Remove with: docker compose down -v
# ---------------------------------------------------------------------------
volumes:
  defined_build:
  defined_install:

networks:
  defined_net:
    driver: bridge
