# nav2_params.yaml
# Defined Robotics — Nav2 node configuration
#
# MIDDLEWARE ADAPTER LAYER (ROS2 / Nav2 Jazzy)
# This file is consumed exclusively by the ROS2 layer inside defined_platform.
# It is never imported by defined_rdf, defined_compiler, or the dashboard.
#
# Robot physical parameters (source of truth: defined_mvp.rdf.yaml):
#   wheel_separation : 0.287 m
#   wheel_radius     : 0.033 m
#   max_linear_vel   : 0.50  m/s
#   max_angular_vel  : 1.00  rad/s
#   base footprint   : 0.25 m x 0.20 m
#
# Nav2 node graph (started by navigation.launch.py):
#   map_server        → /map
#   amcl              → map→odom TF, /amcl_pose
#   planner_server    → /plan  (NavFn / Dijkstra)
#   controller_server → /cmd_vel_nav  (DWB)
#   smoother_server   → path smoothing
#   behavior_server   → Spin, BackUp, Wait recovery behaviours
#   bt_navigator      → /navigate_to_pose action server
#   waypoint_follower → sequential waypoints
#   velocity_smoother → /cmd_vel (smoothed from /cmd_vel_nav)
#
# lifecycle_manager configuration is NOT in this file — it is passed directly
# as node parameters in navigation.launch.py so its startup is not gated on
# YAML injection.  See lifecycle_manager Node() in that file.
#
# The robot has a 2D LiDAR publishing sensor_msgs/LaserScan on /scan.
# AMCL uses /scan for map→odom localisation.  Both costmaps include an
# obstacle layer fed by /scan for real-time obstacle detection.

# ---------------------------------------------------------------------------
# map_server
# yaml_filename is injected at launch time by RewrittenYaml in navigation.launch.py.
# ---------------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""   # overridden at launch time — do not hard-code here

# ---------------------------------------------------------------------------
# amcl — Adaptive Monte Carlo Localisation
# Requires /scan (sensor_msgs/LaserScan).  Without a scanner the filter holds
# position at the initial pose set below; the map→odom TF is still broadcast.
# ---------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: true

    # Particle filter size
    min_particles: 500
    max_particles: 2000

    # Motion model noise (rotation + translation)
    alpha1: 0.2    # rotation noise from rotation
    alpha2: 0.2    # rotation noise from translation
    alpha3: 0.2    # translation noise from translation
    alpha4: 0.2    # translation noise from rotation
    alpha5: 0.2    # strafe (unused for diff-drive, but required param)

    # Coordinate frames
    base_frame_id:  "base_footprint"
    global_frame_id: "map"
    odom_frame_id:  "odom"

    # Laser model
    laser_model_type:          "likelihood_field"
    laser_max_range:           10.0
    laser_min_range:           -1.0
    laser_likelihood_max_dist: 2.0
    laser_max_beams:           60
    scan_topic:                scan

    # Update thresholds — filter updates only when the robot has moved
    update_min_d: 0.25   # metres
    update_min_a: 0.2    # radians

    # Resampling
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5

    # Start the robot at the map origin.
    # The dashboard can refine this by publishing to /initialpose.
    set_initial_pose: true
    initial_pose:
      x:   0.0
      y:   0.0
      z:   0.0
      yaw: 0.0

# ---------------------------------------------------------------------------
# planner_server — global path planning (NavFn / Dijkstra)
# ---------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin:        "nav2_navfn_planner::NavfnPlanner"
      tolerance:     0.5     # goal tolerance (m) — how close counts as reached
      use_astar:     false   # false = Dijkstra; true = A*
      allow_unknown: true    # plan through unknown cells (safe for known map)

# ---------------------------------------------------------------------------
# controller_server — local trajectory following (DWB)
# Subscribes /plan, publishes /cmd_vel_nav.
# velocity_smoother re-publishes as /cmd_vel (final robot command).
# ---------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold:     0.001
    min_y_velocity_threshold:     0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance:            0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins:     ["goal_checker"]
    controller_plugins:       ["FollowPath"]

    progress_checker:
      plugin:                    "nav2_controller::SimpleProgressChecker"
      required_movement_radius:  0.5
      movement_time_allowance:   10.0

    goal_checker:
      plugin:          "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.25
      yaw_goal_tolerance: 0.25
      stateful:           true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Velocity limits — must match defined_mvp.rdf.yaml
      min_vel_x:     0.0
      min_vel_y:     0.0
      max_vel_x:     0.5
      max_vel_y:     0.0    # differential drive: no lateral velocity
      max_vel_theta: 1.0
      min_speed_xy:  0.0
      max_speed_xy:  0.5
      min_speed_theta: 0.0

      # Acceleration limits
      acc_lim_x:     2.5
      acc_lim_y:     0.0
      acc_lim_theta: 3.2

      # Deceleration limits (signed negative)
      decel_lim_x:     -2.5
      decel_lim_y:      0.0
      decel_lim_theta: -3.2

      # Trajectory sampling
      vx_samples:     20
      vy_samples:      5
      vtheta_samples: 20
      sim_time:        1.7
      linear_granularity:  0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance:   0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # DWB critics (scoring functions for candidate trajectories)
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

      BaseObstacle.scale:                  0.02
      PathAlign.scale:                     32.0
      PathAlign.forward_point_distance:     0.1
      GoalAlign.scale:                     24.0
      GoalAlign.forward_point_distance:     0.1
      PathDist.scale:                      32.0
      GoalDist.scale:                      24.0
      RotateToGoal.scale:                  32.0
      RotateToGoal.slowing_factor:          5.0
      RotateToGoal.lookahead_time:         -1.0

# ---------------------------------------------------------------------------
# smoother_server — optional path smoother
# ---------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin:        "nav2_smoother::SimpleSmoother"
      tolerance:     1.0e-10
      max_its:       1000
      do_refinement: true

# ---------------------------------------------------------------------------
# behavior_server — recovery behaviours
# ---------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic:    local_costmap/costmap_raw
    footprint_topic:  local_costmap/published_footprint
    cycle_frequency:  10.0

    behavior_plugins:
      - "spin"
      - "backup"
      - "drive_on_heading"
      - "assisted_teleop"
      - "wait"

    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    global_frame:        odom
    robot_base_frame:    base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel:  1.0
    min_rotational_vel:  0.4
    rotational_acc_lim:  3.2

# ---------------------------------------------------------------------------
# bt_navigator — BT-based NavigateToPose / NavigateThroughPoses action server
# ---------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame:      map
    robot_base_frame:  base_footprint
    odom_topic:        /odom
    bt_loop_duration:      10    # ms per BT tick
    default_server_timeout: 20   # s — server call timeout

    # In Jazzy, Nav2 auto-discovers BT node plugins — no explicit plugin_lib_names needed.
    # Default BT XMLs are resolved automatically; only override if using custom trees.

# ---------------------------------------------------------------------------
# waypoint_follower — navigates through an ordered list of waypoints
# ---------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate:       20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin:                "nav2_waypoint_follower::WaitAtWaypoint"
      enabled:               true
      waypoint_pause_duration: 200   # ms pause at each waypoint

# ---------------------------------------------------------------------------
# velocity_smoother — smooths /cmd_vel_nav → /cmd_vel
# Remappings in navigation.launch.py ensure the correct topic wiring.
# ---------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time:        true
    smoothing_frequency: 20.0
    scale_velocities:    false
    feedback:            "OPEN_LOOP"
    max_velocity:  [0.5, 0.0,  1.0]
    min_velocity:  [-0.5, 0.0, -1.0]
    max_accel:     [2.5, 0.0,  3.2]
    max_decel:     [-2.5, 0.0, -3.2]
    odom_topic:          "odom"
    odom_duration:       0.1
    deadband_velocity:   [0.0, 0.0, 0.0]
    velocity_timeout:    1.0

# ---------------------------------------------------------------------------
# local_costmap — used by controller_server for local obstacle avoidance.
# Obstacle layer reads /scan; inflation adds clearance zone.
# ---------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time:      true
      update_frequency:  5.0
      publish_frequency: 2.0
      global_frame:      odom
      robot_base_frame:  base_footprint
      rolling_window:    true
      width:   3
      height:  3
      resolution: 0.05
      # Robot footprint polygon (0.25 m x 0.20 m base with 20 mm padding)
      footprint: "[ [0.145, 0.12], [0.145, -0.12], [-0.145, -0.12], [-0.145, 0.12] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin:             "nav2_costmap_2d::ObstacleLayer"
        enabled:            true
        observation_sources: scan
        scan:
          topic:               /scan
          max_obstacle_height: 2.0
          clearing:            true
          marking:             true
          data_type:           "LaserScan"
          raytrace_max_range:  3.5
          raytrace_min_range:  0.20
          obstacle_max_range:  3.5
          obstacle_min_range:  0.20
      inflation_layer:
        plugin:             "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius:    0.30
      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# global_costmap — used by planner_server for global path planning.
# static_layer reads /map; obstacle_layer reads /scan; inflation adds clearance.
# ---------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time:      true
      update_frequency:  2.0
      publish_frequency: 2.0
      global_frame:      map
      robot_base_frame:  base_footprint
      footprint: "[ [0.145, 0.12], [0.145, -0.12], [-0.145, -0.12], [-0.145, 0.12] ]"
      resolution:          0.05
      track_unknown_space: true
      width:  14
      height: 14
      origin_x: -7.0
      origin_y: -7.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin:                        "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin:             "nav2_costmap_2d::ObstacleLayer"
        enabled:            true
        observation_sources: scan
        scan:
          topic:               /scan
          max_obstacle_height: 2.0
          clearing:            true
          marking:             true
          data_type:           "LaserScan"
          raytrace_max_range:  3.5
          raytrace_min_range:  0.20
          obstacle_max_range:  3.5
          obstacle_min_range:  0.20
      inflation_layer:
        plugin:             "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius:    0.30
      always_send_full_costmap: true

# ---------------------------------------------------------------------------
# map_saver — service for saving the current map to disk
# ---------------------------------------------------------------------------
map_saver:
  ros__parameters:
    use_sim_time:               true
    save_map_timeout:           5.0
    free_thresh_default:        0.25
    occupied_thresh_default:    0.65
    map_subscribe_transient_local: true
